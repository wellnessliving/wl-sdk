  '/Wl/Passport/Login/Enter/PassportOtp.json':
    get:
      summary: 'Sends an OTP code to the user''s email or phone number to initiate authorization. Checks the OTP rate limit, generates a new code for the given user, and dispatches it according to the chosen delivery strategy. The user must not be already signed in and must not be an admin. There are two ways to specify the delivery channel: **1. Broadcast strategy** (default) Set `$id_delivery_strategy` to `0` or {@link OtpDeliveryStrategyEnum::BROADCAST} (or omit it entirely). Use `$is_mail` and/or `$is_phone` to specify which channels to use. At least one of them must be `true`; the OTP is sent to every channel that is enabled. The user must have a corresponding contact — a phone number when `$is_phone` is `true`, an email when `$is_mail` is `true` — otherwise an error is thrown. Example: set `$is_mail = true` and `$is_phone = true` to send OTP via both email and SMS simultaneously. **2. Priority strategy** Set `$id_delivery_strategy` to {@link OtpDeliveryStrategyEnum::PRIORITY}. Provide `$text_delivery_priority` — a comma-separated list of `sms` and `email` values in the preferred order, e.g. `"sms,email"`. The system picks the first channel from the list for which the user has valid contact data and sends the OTP only to that one channel. The selected channel is returned in `$text_delivery_selected`; when SMS is selected, the last four digits of the phone are returned in `$text_phone_masked`. If none of the listed channels can be used, an error is thrown. Example: set `$text_delivery_priority = "sms,email"` to prefer SMS but fall back to email if the user has no phone number.'
      parameters:
        - name: id_delivery_strategy
          in: query
          description: 'Type of delivery strategy from {@link OtpDeliveryStrategyEnum}.'
          schema:
            type: number
            format: int32
        - name: is_mail
          in: query
          description: 'Whether OTP code will be sending to user via email. `true` if OTP code is sending through email, `false` if OTP code is sending through phone number.'
          schema:
            type: boolean
        - name: is_phone
          in: query
          description: 'Whether OTP code will be sending to user via email. `true` if OTP code is sending through phone number, `false` if OTP code is sending through email.'
          schema:
            type: boolean
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: text_delivery_priority
          in: query
          description: 'Priority of delivery. Fixed values `sms` and `email` are supported. Should be given in priority order comma-separated.'
          schema:
            type: string
        - name: uid
          in: query
          description: 'User key.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      text_delivery_selected:
                        type: string
                        description: 'Delivery channel that was selected based on the given priorities and user data. Fixed values `sms` and `email` are supported. Only one value is returned.'
                      text_phone_masked:
                        type: string
                        description: 'Phone number masked with `*` symbols in case if we have priority sending and sms sending was selected.'
      tags:
        - Enter-PassportOtp
    post:
      summary: 'Verifies the submitted OTP code and establishes an authorized session for the user. Validates the OTP code for the given user, signs in the session, fires the post-login event, completes business registration if applicable, and returns the redirect URL for the business frontend.'
      parameters:
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: uid
          in: query
          description: 'User key.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                s_otp_code:
                  type: string
                  description: 'Otp code integer that was random generated.'
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      i_attempt_left:
                        type: number
                        format: int32
                        description: 'Number of attempts left to submit the correct otp code.'
                      url_redirect:
                        type: string
                        description: 'Redirect url after successful authorization.'
      tags:
        - Enter-PassportOtp
