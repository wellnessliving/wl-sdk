e and time in UTC in MySQL datetime format. `null` if the invitation  has not been redeemed. </dd> <dt>string|null `dtu_reject`</dt> <dd>Rejection date and time in UTC in MySQL datetime format. `null` if the invitation has not been rejected.</dd> <dt>int `id_status`</dt> <dd>Invitation lifecycle status. One of {@link \Wl\Login\Promotion\GuestPass\Invite\InviteStatusEnum} values.</dd> <dt>bool|null `is_checkin`</dt> <dd> `true` if the guest may only enter when the inviting member is checked in. `null` if no guest pass settings are configured for the promotion. </dd> <dt>bool `is_visit_future`</dt> <dd>`true` if associated visit in future, `false` otherwise.</dd> <dt>string|null `k_login_promotion_guest`</dt> <dd> Login promotion key granted to the guest upon acceptance. <i>Primary key from {@link \RsLoginPromotionSql} table.</i> `null` if the invitation has not been accepted. </dd> <dt>string `k_login_promotion_host`</dt> <dd>Login promotion key of the host membership. <i>Primary key from {@link \RsLoginPromotionSql} table.</i></dd> <dt>string `k_promotion`</dt> <dd>Guest promotion key. <i>Primary key from {@link \RsPromotionSql} table.</i></dd> <dt>string|null `k_visit`</dt> <dd> Visit key redeemed with this guest pass. <i>Primary key from {@link \RsVisitSql} table.</i> `null` if no visit is associated. </dd> <dt>string `s_secret`</dt> <dd>Secret token used to accept or reject the invitation via a direct link.</dd> <dt>string|null `text_host_name`</dt> <dd>Full name of the host user who sent the invitation. `null` if the host could not be resolved.</dd> <dt>string `text_promotion_guest`</dt> <dd>Title of the guest promotion.</dd> <dt>string `text_promotion_host`</dt> <dd>Title of the host promotion.</dd> <dt>string|null `text_service_title`</dt> <dd>Title of the service booked with the guest pass. `null` if no visit is associated.</dd> <dt>string `text_timezone`</dt> <dd>Name of the business timezone used for all `dtl_*` fields (e.g. "America/New_York").</dd> <dt>string|null `uid_host`</dt> <dd> User key of the host who sent the invitation. <i>Primary key from {@link \PassportLoginSql} table.</i> `null` if the host could not be resolved. </dd> <dt>string `url_service`</dt> <dd> URL to the attendance page for the associated class period. Empty string if no visit is associated or the visit is not a class. </dd> </dl>'
