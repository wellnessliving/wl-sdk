  '/Thoth/WlPay/Bank/Card/List.json':
    get:
      summary: 'Retrieves information about user''s bank cards. Returns the list of saved payment cards for the specified user and business, including card number fragment, expiry date, card system, holder name, and default status. Also returns whether new cards can be added.'
      parameters:
        - name: k_business
          in: query
          description: 'ID of current business.'
          schema:
            type: string
        - name: k_location
          in: query
          description: 'Location to show information for. <tt>0</tt> to use user''s home location.'
          schema:
            type: string
        - name: uid
          in: query
          description: 'ID of a user to show information for.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_bank_card:
                        type: array
                        description: 'A list of bank cards. The array keys are the card `k_pay_bank` IDs. Each element has the following keys: <dl> <dt>int `i_month`</dt> <dd>The month when the payment card expires, represented by a number (1=January and 12=December).</dd> <dt>int `i_year`</dt> <dd>The last two digits of the year when the payment card expires.</dd> <dt>int `id_card_system`</dt> <dd>The card system ID. This is one of the {@link \ACardSystemSid} constants.</dd> <dt>bool `is_default`</dt> <dd>If `true`, then this card is the user default card. If `false`, then this isn''t the user default card.</dd> <dt>string `k_pay_address`</dt> <dd>The payment address ID. This refers to a physical address associated with a payment card.</dd> <dt>string `k_pay_bank`</dt> <dd>The payment method ID. Each payment card for each user will have its own ID.</dd> <dt>string `text_name_card`</dt> <dd> The payment card descriptor. This is typically the company name and the last 4 digits of the card (for example, visa-5903). </dd> <dt>string `text_name_holder`</dt> <dd>The name of the card owner as it appears on the card.</dd> <dt>string `text_number`</dt> <dd> A portion of the payment card number, used to identify the card. This is typically the last 4 digits of the card number. </dd> </dl>'
                      a_list:
                        type: array
                        description: 'List of bank cards. Duplicate of {@link \Thoth\WlPay\Bank\Card\ListApi::$a_bank_card} as a flat indexed array. <dl> <dt>int `i_month`</dt> <dd>The month when the payment card expires, represented by a number (1=January and 12=December).</dd> <dt>int `i_year`</dt> <dd>The last two digits of the year when the payment card expires.</dd> <dt>int `id_card_system`</dt> <dd>The card system ID. This is one of the {@link \ACardSystemSid} constants.</dd> <dt>bool `is_default`</dt> <dd>If `true`, then this card is the user default card. If `false`, then this isn''t the user default card.</dd> <dt>string `k_pay_address`</dt> <dd>The payment address ID. This refers to a physical address associated with a payment card.</dd> <dt>string `k_pay_bank`</dt> <dd>The payment method ID. Each payment card for each user will have its own ID.</dd> <dt>string `text_name_card`</dt> <dd> The payment card descriptor. This is typically the company name and the last 4 digits of the card (for example, visa-5903). </dd> <dt>string `text_name_holder`</dt> <dd>The name of the card owner as it appears on the card.</dd> <dt>string `text_number`</dt> <dd> A portion of the payment card number, used to identify the card. This is typically the last 4 digits of the card number. </dd> </dl>'
                      can_add:
                        type: boolean
                        description: 'Whether new card can be added. `true` if new cards can be added. `false` if new cards can not be added.'
      tags:
        - Card-List
  '/Thoth/WlPay/Transaction/Report/TransactionAllPayment.json':
    get:
      summary: 'Returns All Transactions Report data for the specified date range. Provides access to the All Transactions Report used for revenue reconciliation and export. The report is generated asynchronously and cached; check `$id_report_status` to determine whether generation is still in progress. Set `$is_refresh` to request regeneration and use `$i_page` to paginate through up to {@link TransactionAllPaymentApi::LIMIT} rows per request.'
      parameters:
        - name: dl_date_end
          in: query
          description: 'The end date in local time to retrieve transactions for.'
          schema:
            type: string
        - name: dl_date_start
          in: query
          description: 'The end date in local time to retrieve transactions for.'
          schema:
            type: string
        - name: i_page
          in: query
          description: 'The page of the report, starting from 0. Each page will contain a maximum of {@link TransactionAllPaymentApi::LIMIT} rows.'
          schema:
            type: number
            format: int32
        - name: is_refresh
          in: query
          description: 'Determines whether the report should be refreshed. If `true`, this report should be refreshed. A report refresh can''t be requested while the report is being generated. Otherwise, `false` to only return contents of the report. If the report hasn''t yet been generated, it will automatically start generating in the background.'
          schema:
            type: boolean
        - name: k_business
          in: query
          description: 'The key of the business for which report should be generated.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_field:
                        type: array
                        description: 'A list of fields in the report. This array is effectively a title row for the table returned in {@link TransactionAllPaymentApi::$a_row}.'
                      a_row:
                        type: array
                        description: 'The report data. This is an indexed array where each element is also an indexed array representing one report row. Column positions in each row correspond to the field names in {@link TransactionAllPaymentApi::$a_field}. Known columns (use {@link TransactionAllPaymentApi::$a_field} to resolve their positional indexes): <dl> <dt>array `a_pay_transaction`</dt> <dd> List of pay transactions associated with this row. Each element: <dl> <dt>int `id_pay_method`</dt> <dd>Payment method ID. One of {@link \RsPayMethodSid} constants.</dd> <dt>string `k_pay_transaction`</dt> <dd>Pay transaction key. <i>Primary key in the {@link \RsPayTransactionSql} table.</i></dd> <dt>string `m_amount`</dt> <dd>Amount paid.</dd> <dt>string `m_surcharge`</dt> <dd>Surcharge amount from store settings.</dd> <dt>string `s_batch_number`</dt> <dd>Batch number for this transaction.</dd> </dl> </dd> <dt>string `dtu_purchase_start`</dt> <dd>Start date and time of the purchase in UTC.</dd> <dt>string `k_purchase`</dt> <dd>Purchase key. <i>Primary key in the {@link \RsPurchaseSql} table.</i></dd> <dt>string `m_net_sale`</dt> <dd>Net sales amount.</dd> <dt>string `m_total_tax`</dt> <dd>Total tax amount.</dd> <dt>string `o_client.text_first`</dt> <dd>First name of the client.</dd> <dt>string `o_client.text_last`</dt> <dd>Last name of the client.</dd> <dt>string `o_client.text_name`</dt> <dd>Full name of the client.</dd> <dt>string `o_location.k_location`</dt> <dd>Location key. <i>Primary key in the {@link \RsLocationSql} table.</i></dd> <dt>string `s_batch_number`</dt> <dd>Batch number of the first transaction in the row.</dd> <dt>string `text_location_address`</dt> <dd>Street address of the location.</dd> <dt>string `text_location_city`</dt> <dd>Name of the location''s city.</dd> <dt>string `text_location_country`</dt> <dd>Name of the location''s country.</dd> <dt>string `text_location_postal`</dt> <dd>Postal code of the location.</dd> <dt>string `text_location_region`</dt> <dd>Name of the location''s region.</dd> <dt>string `text_payment_method`</dt> <dd>Name of the payment method used.</dd> <dt>string `text_payment_method_base`</dt> <dd>Name of the base payment method. If a custom method was used, this is the method it is based on.</dd> <dt>string `text_tax_title`</dt> <dd>Comma-separated list of tax names applied to the purchase.</dd> <dt>string `text_tax_value`</dt> <dd> Comma-separated list of tax values. Percentage-based taxes have `%` appended; fixed-amount taxes have `$` appended. </dd> </dl>'
                      a_warning:
                        type: array
                        description: 'The warning list of the report.'
                      dtu_complete:
                        type: [string, "null"]
                        description: 'The date and time if the report has completed generation. Otherwise, this will be `null`.'
                      dtu_queue:
                        type: [string, "null"]
                        description: 'The date and time if this report has been put in the generation queue. Otherwise, this will be `null`.'
                      dtu_start:
                        type: [string, "null"]
                        description: 'The date and time if generation of this report has started. Otherwise, this will be `null`.'
                      id_report_status:
                        type: number
                        format: int32
                        description: 'The report status. One of {@link \Wl\Report\Generator\ReportGeneratorStatusSid} constants.'
                      is_more:
                        type: boolean
                        description: 'Determines whether to show more rows in the report. If `true`, there are more report rows to get. Otherwise, `false` to indicate that all rows in the report have already been retrieved.'
                      is_report_complete:
                        type: boolean
                        description: 'Determines whether the report is complete. If the report is accessed on the current day, or is returning a result that was cached on the current day, it could be incomplete as not all the transactions for the day are present. If `true`, the report has been completed. Otherwise, `false`.'
      tags:
        - Report-TransactionAllPayment
  '/Thoth/WlPay/Account/Charge/Charge.json':
    post:
      summary: 'Refills the user account balance by the specified payment amount or adjusts it manually. Accepts the payment amount, account key or user-and-business identifiers, charge mode, and payment form data. Processes the payment through the configured payment environment and returns the purchase key when a new purchase is created (for the automatic charge mode).'
      parameters:
        - name: id_pay_account_charge
          in: query
          description: 'The account charge mode. One of the {@link \RsPayAccountChargeSid} constants.'
          schema:
            type: number
            format: int32
        - name: is_staff
          in: query
          description: 'If `true`, the account is filled by a staff member in the backend. Otherwise, this will be `false`.'
          schema:
            type: boolean
        - name: k_business
          in: query
          description: 'The ID of the business the user account belongs to. This shouldn''t be passed if a user account has already been created. In such cases, {@link ChargeApi::$k_pay_account} should be passed instead. If both the business ID and account ID passed, the system checks if the given business is the owner of the specified account.'
          schema:
            type: string
        - name: k_pay_account
          in: query
          description: 'The ID of the user account to refill. This may be 0 if a user account hasn''t been created yet. In such cases, {@link ChargeApi::$k_business} and {@link ChargeApi::$uid} should be passed instead. If not passed, the currency of account equals the default business currency.'
          schema:
            type: string
        - name: uid
          in: query
          description: 'The ID of the user whose account is being refilled. This shouldn''t be passed if a user account has already been created. In such cases, {@link ChargeApi::$k_pay_account} should be passed instead. If both the user ID and account ID passed, the system checks if the given user is the owner of the specified account.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                a_pay_form:
                  type: array
                  description: 'A list of payment sources to pay with. Each element has next keys: <dl> <dt>array `a_pay_card`</dt> <dd> The payment card information: <dl> <dt>array `a_pay_address`</dt> <dd> The payment address: <dl> <dt>bool `is_new`</dt> <dd>Set this value to `1` to add a new payment address or to `0` to use a saved payment address.</dd> <dt>string `k_geo_country`</dt> <dd>The key of the country used for the payment address. Specify this to add a new address.</dd> <dt>string `k_geo_region`</dt> <dd>The key of the region for the payment address. Specify this to add a new address.</dd> <dt>string `k_pay_address`</dt> <dd>The key of the saved payment address. Specify this to use a saved address.</dd> <dt>string `s_city`</dt> <dd>The city used for the payment address. Specify this to add a new address.</dd> <dt>string `s_name`</dt> <dd>The card name. Specify this to add a new address.</dd> <dt>string `s_phone`</dt> <dd>The payment phone. Specify this to add a new address.</dd> <dt>string `s_postal`</dt> <dd>The postal code for the payment address. Specify this to add a new address.</dd> <dt>string `s_street1`</dt> <dd>The payment address. Specify this to add a new address.</dd> <dt>string `s_street2`</dt> <dd>The optional payment address. Specify this to add a new address.</dd> </dl> </dd> <dt>int `i_csc`</dt> <dd>The credit card CSC. Specify this to add a new card.</dd> <dt>int `i_month`</dt> <dd>The credit card expiration month. Specify this to add a new card.</dd> <dt>int `i_year`</dt> <dd>The credit card expiration year. Specify this to add a new card.</dd> <dt>bool `is_new`</dt> <dd>Specify `1` to add a new card, or `0` to use a saved card.</dd> <dt>string `k_pay_bank`</dt> <dd>The key of the credit card. Specify this to use saved card.</dd> <dt>string `s_comment`</dt> <dd>Optional comment(s). Specify this to add a new card.</dd> <dt>string `s_number`</dt> <dd>The card number. Specify this to add a new card.</dd> </dl> </dd> <dt>string `f_amount`</dt> <dd>The amount of money to withdraw with this payment source.</dd> <dt>bool `is_hide`</dt> <dd>Determines whether this payment method is hidden.</dd> <dt>bool `is_save`</dt> <dd>Whether payment method should be saved to user''s account.</dd> <dt>bool `is_success`</dt> <dd>Identifies whether this source was successfully charged.</dd> <dt>string `m_surcharge`</dt> <dd>The client-side calculated surcharge.</dd> <dt>string `s_index`</dt> <dd>The index of this form (optional).</dd> <dt>string `sid_pay_method`</dt> <dd>The payment method ID.</dd> </dl>'
                id_mode:
                  type: number
                  format: int32
                  description: 'The source mode key. One of the {@link \Wl\Mode\ModeSid} constants.'
                m_amount:
                  type: string
                  description: 'The payment amount.'
                s_comment:
                  type: string
                  description: 'The transaction comment.'
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      k_purchase:
                        type: string
                        description: 'The ID of the purchase that was created during payment. This value is only returned in cases where a purchase was created. A new purchase is created when {@link ChargeApi::$id_pay_account_charge} equals {@link \RsPayAccountChargeSid::AUTO}.'
      tags:
        - Charge-Charge
