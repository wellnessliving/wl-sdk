 <dt>string `text_flag_description`</dt> <dd>Description of the flag source for display.</dd> <dt>string `text_flag_disable`</dt> <dd>Text explaining how to disable the automated flag. Empty string if the flag is manual.</dd> <dt>string `uid`</dt> <dd>User key of the flagged client. <i>Primary key in the {@link \PassportLoginSql} table.</i></dd> <dt>string `url_action`</dt> <dd>URL to submit the login note edit form.</dd> </dl>'
