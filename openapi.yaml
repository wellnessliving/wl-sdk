  '/Wl/Classes/ClassList/List.json':
    get:
      summary: 'Returns list of classes and events in the business. Used by import and integration tools to enumerate all classes and events offered by a business. In franchise mode, classes from all franchisee locations are included. Results are sorted by title and start date.'
      parameters:
        - name: a_class_tab
          in: query
          description: 'List of tabs keys. Filtering by Book Now Tab is not supported if {@link ListApi::$is_franchise} is `true`. `null` if no filtering by Book Now Tab is required.'
          schema:
            type: [array, "null"]
        - name: id_class_tab
          in: query
          description: 'ID of book now tab. One of {@link TabSid} constants. Only {@link TabSid::TRAINING} and {@link TabSid::ENROLLMENT} book now tab are supported. Filtering by Book Now Tab is not supported if {@link ListApi::$is_franchise} is `true`. `null` if no filtering by Book Now Tab is required.'
          schema:
            type: [number, "null"]
        - name: is_enrollment_block_all
          in: query
          description: 'Whether all events should be returned from same enrollment block. * <tt>true</tt> to return all events from same enrollment block. * <tt>false</tt> to return only one event from each enrollment block. Only published and non-empty events will be returned for the client. To return empty events, use {@link ListApi::$is_enrollment_block_empty}. For the staff, filtering by publication or emptiness is not applied.'
          schema:
            type: boolean
        - name: is_enrollment_block_empty
          in: query
          description: 'Whether to include events without sessions. An empty event is neither published nor unpublished. It simply has no sessions. Such events can be useful for list filters. Affects clients only. Does not affect staff. Staff always see empty events. Makes sense in conjunction with the flag {@link ListApi::$is_enrollment_block_all}. * <tt>true</tt> to include events without sessions. * <tt>false</tt> to exclude events without sessions.'
          schema:
            type: boolean
        - name: is_event_include
          in: query
          description: 'Whether to include events in the result. true` to include both classes and events. false` to include only classes.'
          schema:
            type: boolean
        - name: is_franchise
          in: query
          description: 'Whether to return franchisee-created classes (if business is franchisor). <tt>true</tt> to include franchisee-created classes.'
          schema:
            type: boolean
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_class:
                        type: array
                        description: 'List of classes and events. The result may depend on the following flags: * {@link ListApi::$is_enrollment_block_all} * {@link ListApi::$is_enrollment_block_empty} Each element has the following structure: <dl> <dt>string[] `a_class_tab`</dt> <dd> List of class book now tabs, where this class is presented. Each element is <i>primary key from {@link \Wl\Classes\Tab\Sql\ClassTab\Sql}</i> or `null` if class is presented in default system tab Classes. Events can also be added in class tabs. </dd> <dt>string[] `a_event_tab`</dt> <dd> List of event book now tabs, where this event is presented. Each element is <i>primary key from {@link \Wl\Classes\Tab\Sql\ClassTab\Sql}</i> or `null` if event is presented in default system tab Enrollments. Classes cannot be added in event tabs. </dd> <dt>string `dl_end`</dt> <dd>The ending date of the class/event. Maybe a zero date if the class is ongoing (has no end date).</dd> <dt>string `dl_start`</dt> <dd>The starting date of the class/event.</dd> <dt>bool `is_active`</dt> <dd>Whether class/event is active.</dd> <dt>bool `is_event`</dt> <dd>Define if current element is event.<tt>true</tt> - event, <tt>false</tt> - class.</dd> <dt>bool `is_remove`</dt> <dd>Whether class/event is removed.</dd> <dt>string `k_class`</dt> <dd>Class/event identifier. <i>Primary key in {@link \RsClassSql}.</i></dd> <dt>string `k_enrollment_block`</dt> <dd>Event Block ID. <i>Primary key in {@link \RsEnrollmentBlockSql}.</i></dd> <dt>string `text_title`</dt> <dd>Class/event name.</dd> </dl>'
      tags:
        - ClassList-List
