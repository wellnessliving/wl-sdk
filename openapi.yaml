    post:
      summary: 'Saves a quiz response with the given element answers. Validates the submitted answers and persists the response record in a transaction. If {@link \Core\Quiz\QuizResponseApi::$is_validate_only} is set, only validation runs and no record is created. Pass {@link \Core\Quiz\QuizResponseApi::$is_skip} to bypass validation for pre-confirmed responses.'
      parameters:
        - name: can_anonymous
          in: query
          description: 'Checks whether unauthorized user should be permitted to operate with form and make a response. In general all quizzes should have users in response but it some cases such as registration process user might not exist yet, and we need ability to ignore check for user existence. `true` - add possibility load form and accept response for non-registered user, `false` otherwise.'
          schema:
            type: boolean
        - name: is_simple
          in: query
          description: 'Whether quiz response received by kiosk or direct mode link. `true` quiz response received by kiosk mode. `false` quiz response received by direct or direct mode.'
          schema:
            type: boolean
        - name: k_business
          in: query
          description: 'Business key within which quiz is managed.'
          schema:
            type: string
        - name: k_quiz
          in: query
          description: 'Quiz key.'
          schema:
            type: string
        - name: k_quiz_response
          in: query
          description: 'Quiz response key. `null` in a case of response creation or removing set of responses in {@link \Core\Quiz\QuizResponseApi::$a_quiz_response_key}.'
          schema:
            type: [string, "null"]
