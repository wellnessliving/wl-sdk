  '/Wl/Book/Cancel/CancelCan.json':
    get:
      summary: 'Returns information about whether the given user can cancel the booking and the expected consequences. Accepts a business key and a visit key, validates access, and performs a dry-run cancellation to determine whether the visit can be cancelled online, whether a late-cancel penalty applies, and whether the purchase option credit would be refunded.'
      parameters:
        - name: k_business
          in: query
          description: 'Key of the business within which the action is performed.'
          schema:
            type: string
        - name: k_visit
          in: query
          description: 'Visit key.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_penalty:
                        type: [array, "null"]
                        description: 'Penalty data. `null` if penalty must be not applied. <dl> <dt>bool `is_flat`</dt> <dd>`true` in a case of flat penalty type; `false` in a case of percentage penalty type.</dd> <dt>string `k_currency`</dt> <dd>Currency key. <i>Primary key in {@link \RsCurrencySql} table.</i></dd> <dt>string `m_amount`</dt> <dd>Penalty amount.</dd> </dl>'
                      can_cancel:
                        type: boolean
                        description: '`true` if the booking can be canceled online by the specified user, `false` otherwise. Cancellation is possible only if the current visit status is {@link VisitSid::BOOK} or {@link VisitSid::WAIT}.'
                      is_flag:
                        type: boolean
                        description: '`true` if the client''s account will be flagged instead of charging a monetary fee, `false` otherwise. Meaningful only when {@link CancelCanApi::$is_late} is `true`.'
                      is_late:
                        type: boolean
                        description: '`true` if the cancellation would be considered a late cancel, `false` otherwise. Late cancel applies only to bookings with status {@link VisitSid::BOOK}. Wait-list bookings ({@link VisitSid::WAIT}) are never subject to late cancellation rules.'
                      is_refund:
                        type: boolean
                        description: '`true` if the visit credit (from the purchase option used to book) will be returned to the user''s profile after cancellation, `false` otherwise. For regular (non-late) cancellations, the credit is always returned when the booking was made with a purchase option. For late cancellations, return depends on the business''s Payment Return Policy.'
      tags:
        - Cancel-CancelCan
