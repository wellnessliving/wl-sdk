      summary: 'Sends an OTP code to the user''s email or phone number to initiate authorization. Checks the OTP rate limit, generates a new code for the given user, and dispatches it via email, SMS, or both depending on `$is_mail` and `$is_phone`. The user must not be already signed in and must not be an admin.'
