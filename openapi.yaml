                      is_first_payment:
                        type: boolean
                        description: '<tt>true</tt> means discount code can be applied to first membership payment only. <tt>false</tt> means discount code can be applied to all membership payments.'
                      is_login_type:
                        type: boolean
                        description: '<tt>true</tt> means that only selected client types or groups can use this discount code. <tt>false</tt> means that all client types and groups can use this discount code.'
                      is_online:
                        type: boolean
                        description: '<tt>true</tt> if clients can use this discount code in online store, <tt>false</tt> if discount code can be used only in point of sale.'
                      is_percent:
                        type: boolean
                        description: '<tt>true</tt> means discount value is percent from the purchase amount. <tt>false</tt> means discount value is fixed sum from the purchase amount.'
                      is_purchase_all:
                        type: boolean
                        description: '<tt>true</tt> means discount can be applied to all products and purchase options. <tt>false</tt> means discount can be applied only to the selected product and purchase options.'
                      s_component:
                        type: string
                        description: 'List of product and purchase options that are effected with this discount code. Each element has the next format: <var>id_purchase_item</var>:<var>k_id</var>, where <tt>id_purchase_item</tt> - one of {@link \RsPurchaseItemSid}, <tt>k_id</tt> is key of certain purchase item. <i>Processed by function {@link \Core\Tool\UrlEncode\UrlEncode::encode()}.</i>'
                      text_code:
                        type: string
                        description: 'Discount code that can be used during purchase.'
                      text_description:
                        type: string
                        description: 'Description of the discount code.'
                      text_title:
                        type: string
                        description: 'Name of the discount code.'
      tags:
        - Edit-DiscountCodeEdit
    post:
      summary: 'Saves information about discount code or create new. Used to create a new discount code or update an existing one from the backend editor. Pass no discount code key to create; pass an existing key to update. Returns the key of the saved code.'
      parameters:
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: k_discount_code
          in: query
          description: 'Key of the discount code. Empty, if this is creation of a new code.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                a_login_type:
                  type: array
                  description: 'List of client types.'
                a_member_group:
                  type: array
                  description: 'List of client groups.'
                dl_end:
                  type: [string, "null"]
                  description: 'Expiration date. <tt>null</tt> if discount code is never expires.'
                dl_start:
                  type: string
                  description: 'Activation date.'
                f_value:
                  type: string
                  description: 'Value of the percentage or fixed discount.'
                i_duration:
                  type: number
                  format: int32
                  description: 'Count of calendar periods from <var>id_duration</var> before expiration.'
                i_limit:
                  type: number
                  format: int32
                  description: 'Maximum count of usage. Zero means unlimited usage.'
                id_duration:
                  type: number
                  format: int32
                  description: 'Calendar periods for discount code duration from {@link \ADurationSid}. Zero if discount code is never expires.'
                id_duration_type:
                  type: number
                  format: int32
                  description: 'Type of the discount code duration from {@link \RsDurationTypeSid}.'
                is_active:
                  type: boolean
                  description: '<tt>true</tt> means discount code is active. <tt>false</tt> means discount code is inactive.'
                is_auto_renew:
                  type: boolean
                  description: '<tt>true</tt> means membership will auto-renew at discounted rate. <tt>false</tt> means membership will auto-renew at full rate.'
                is_coupon:
                  type: boolean
                  description: '<tt>true</tt> means discount code can reduce price of the gift cards. <tt>false</tt> means discount code cannot reduce price of the gift cards. If {@link DiscountCodeEditApi::$is_purchase_all} is <tt>true</tt> this fields does not matter.'
                is_first_payment:
                  type: boolean
                  description: '<tt>true</tt> means discount code can be applied to first membership payment only. <tt>false</tt> means discount code can be applied to all membership payments.'
                is_login_type:
                  type: boolean
                  description: '<tt>true</tt> means that only selected client types or groups can use this discount code. <tt>false</tt> means that all client types and groups can use this discount code.'
                is_online:
                  type: boolean
                  description: '<tt>true</tt> if clients can use this discount code in online store, <tt>false</tt> if discount code can be used only in point of sale.'
                is_percent:
                  type: boolean
                  description: '<tt>true</tt> means discount value is percent from the purchase amount. <tt>false</tt> means discount value is fixed sum from the purchase amount.'
                is_purchase_all:
                  type: boolean
                  description: '<tt>true</tt> means discount can be applied to all products and purchase options. <tt>false</tt> means discount can be applied only to the selected product and purchase options.'
                s_component:
                  type: string
                  description: 'List of product and purchase options that are effected with this discount code. Each element has the next format: <var>id_purchase_item</var>:<var>k_id</var>, where <tt>id_purchase_item</tt> - one of {@link \RsPurchaseItemSid}, <tt>k_id</tt> is key of certain purchase item. <i>Processed by function {@link \Core\Tool\UrlEncode\UrlEncode::encode()}.</i>'
                text_code:
                  type: string
                  description: 'Discount code that can be used during purchase.'
                text_description:
                  type: string
                  description: 'Description of the discount code.'
                text_title:
                  type: string
                  description: 'Name of the discount code.'
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      k_discount_code:
                        type: string
                        description: 'Key of the discount code. Empty, if this is creation of a new code.'
      tags:
        - Edit-DiscountCodeEdit
    put:
      summary: 'Duplicates an existing discount code. Used in the backend when a staff member wants to create a similar discount code without re-entering all settings manually. Creates an exact copy with a new unique code string.'
      parameters:
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: k_discount_code
          in: query
          description: 'Key of the discount code. Empty, if this is creation of a new code.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      k_discount_code:
                        type: string
                        description: 'Key of the discount code. Empty, if this is creation of a new code.'
      tags:
        - Edit-DiscountCodeEdit
  '/Wl/Event/Book/EventView/Element.json':
    get:
      summary: 'Retrieves information about event item. Used to render the event detail page or event card in the booking flow. Returns everything needed to display the event to a prospective client: schedule, pricing, booking availability, assigned staff with photos, and available installment payment options.'
      parameters:
        - name: dl_book_available_end
          in: query
          description: 'The last available date for booking. If this is set and {@link ElementApi::$dl_book_available_start} is a set list of sessions available for booking, {@link ElementApi::$a_book_available} should match given date range.'
          schema:
            type: [string, "null"]
        - name: dl_book_available_start
          in: query
          description: 'The first available date for booking. If this is set and {@link ElementApi::$dl_book_available_end} is a set list of sessions available for booking {@link ElementApi::$a_book_available} should match given date range.'
          schema:
            type: [string, "null"]
        - name: dtu_session
          in: query
          description: 'Datetime of the session. Is not `null` only if we need to get information for an event with a specific class period and datetime. If this is `null`, then the {@link ElementApi::$k_class_period} should be `null` too.'
          schema:
            type: [string, "null"]
        - name: i_image_height
          in: query
          description: 'Image height in pixels. Please specify this value if you need image to be returned in specific size. In case this value is not specified, the returned image will have the default thumbnail size.'
          schema:
            type: number
            format: int32
        - name: i_image_width
          in: query
          description: 'Image width in pixels. Please specify this value if you need image to be returned in specific size. In case this value is not specified, the returned image will have the default thumbnail size.'
          schema:
            type: number
            format: int32
        - name: i_staff_image_height
          in: query
          description: 'Staff image height in pixels. Please specify this value if you need image to be returned in specific size. In case this value is not specified, the returned image will have the default thumbnail size.'
          schema:
            type: number
            format: int32
        - name: i_staff_image_width
          in: query
          description: 'Staff image width in pixels. Please specify this value if you need image to be returned in specific size. In case this value is not specified, the returned image will have the default thumbnail size.'
          schema:
            type: number
            format: int32
        - name: is_schedule_group
          in: query
          description: '`true` if schedule should be grouped by location time and staff, `false` if all schedule elements should be independent.'
          schema:
            type: boolean
        - name: k_business
          in: query
          description: 'Key of a business to which the requested event(s) belong.'
          schema:
            type: [string, "null"]
        - name: k_class_period
          in: query
          description: 'Key of a class period to show information for. Is not `null` only if we need to get information for an event with a specific class period and datetime. If this is `null`, then the {@link ElementApi::$dtu_session} should be `null` too.'
          schema:
            type: [string, "null"]
        - name: k_event
          in: query
          description: 'The event key. You can specify {@link ElementApi::$s_event} instead to get information for a large number of events.'
          schema:
            type: string
        - name: s_event
          in: query
          description: 'A list of event keys serialized with JSON. Specify instead of {@link ElementApi::$k_event} to get information for a large number of events.'
          schema:
            type: string
        - name: show_unpublished
          in: query
          description: '`true` to show schedule, which is not published yet. `false` to show only published schedule.'
          schema:
            type: boolean
        - name: uid
          in: query
          description: 'The user key.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_age_restrictions:
                        type: array
                        description: 'Displays information about age restrictions for this event. An empty array if there are no age restrictions. <dl> <dt>int|null `i_age_from`</dt> <dd> The minimum age for participation in the event. `null` if there''s no minimum age set or information isn''t available. </dd> <dt>int|null `i_age_to`</dt> <dd> The age limit for participation in the event. `null` if there''s no age limit set or information isn''t available. </dd> <dt>bool `is_age_public`</dt> <dd> `true` if age restrictions are public and available, `false` if they''re hidden. When restrictions are hidden and the current user isn''t a staff member, the age range will be empty. </dd> </dl>'
                      a_book_available:
                        type: array
                        description: 'Retrieves information about an event item. Received only if {@link ElementApi::$k_event} has been specified. In this case, other fields aren''t receivers. <dl> <dt>string `dt_date`</dt> <dd>Date/time when the session starts. In UTC.</dd> <dt>string `k_class_period`</dt> <dd>Class session primary keys. <i>Primary keys in table {@link \RsClassPeriodSql}.</i></dd> </dl>'
                      a_business_policy:
                        type: array
                        description: 'Business policies connected to clients and bookings. Contains the same structure as {@link BusinessConfigApi::$a_business_policy}. If the event has custom overrides, those policies are used; otherwise, the default business policies are returned. <dl> <dt>int[] `a_payment_reattempt_not_decline_reason`</dt> <dd> List of not allowed decline reasons to payment reattempt. Each element is one of {@link \Thoth\WlPay\PayExceptionSid} constants. </dd> <dt>bool[] `a_wait_service`</dt> <dd>Keys are list of IDs from {@link \Wl\Service\ServiceSid}, and values are flags whether wait list is allowed.</dd> <dt>int `i_book_before`</dt> <dd>Minimum hours|days|months before class should be booked.</dd> <dt>int `i_book_future`</dt> <dd>Maximum hours|days|months after class can be booked.</dd> <dt>int `i_cancel`</dt> <dd>Minimum hours|days|months before class should be canceled without penalty.</dd> <dt>int `i_promote`</dt> <dd>Minimum hours|days|months before class should be promoted from wait list.</dd> <dt>int `i_promote_fastest_response`</dt> <dd> Minimum hours|days|months the notifications which are sent for client confirmation required should be sent to all clients on the wait list at the same time up to the cut off time. </dd> <dt>int `i_promote_require_confirm`</dt> <dd> Minimum hours|days|months the notifications which are sent for client confirmation must confirm their a promote from the waiting list to the active list. </dd> <dt>int `i_reattempt_count`</dt> <dd>Number of failed auto-payments reattempts.</dd> <dt>int `id_book_before`</dt> <dd>Hours|days|months from {@link \ADurationSid}.</dd> <dt>int `id_book_future`</dt> <dd>Hours|days|months from {@link \ADurationSid}.</dd> <dt>int `id_cancel`</dt> <dd>Hours|days|months from {@link \ADurationSid}.</dd> <dt>int `id_promote`</dt> <dd>Hours|days|months from {@link \ADurationSid}.</dd> <dt>int `id_promote_fastest_response`</dt> <dd>Hours|days|months from {@link \ADurationSid}.</dd> <dt>int `id_promote_require_confirm`</dt> <dd>Hours|days|months from {@link \ADurationSid}.</dd> <dt>bool `is_book_inside_active_pay_period`</dt> <dd> if `true` - clients with purchase options are only allowed to book sessions within their current paid period, `false` - during purchase option''s duration. </dd> <dt>bool `is_disable_promotion`</dt> <dd> 1 if a client''s automatic payment fails, their account should not be debited and their purchase option becomes inactive, 0 - otherwise. Default 0. </dd> <dt>bool `is_enable_payment_penalty`</dt> <dd>Whether to charge penalty after final auto-payment attempt.</dd> <dt>bool `is_enable_payment_reattempt`</dt> <dd>Whether to reattempt failed auto-payments.</dd> <dt>bool `is_enable_staff_ip_restriction`</dt> <dd>Whether to restrict which IP addresses staff can login from.</dd> <dt>bool `is_prevent_booking`</dt> <dd>1 if booking for a client with negative balance is disabled, 0 - otherwise. Default 0.</dd> <dt>bool `is_staff_restrict`</dt> <dd>If true, client can not choose provider while appointment wizard.</dd> <dt>bool `is_wait`</dt> <dd>Enable\disable wait list.</dd> <dt>string `k_currency`</dt> <dd>Currency from rs.currency table.</dd> <dt>string `k_timezone`</dt> <dd>Timezone from get.timezone table.</dd> <dt>string `m_payment_penalty`</dt> <dd>Penalty amount to charge after final auto-payment attempt.</dd> <dt>string `url_custom`</dt> <dd>Custom Url of a business</dd> </dl>'
                      a_class_logo:
                        type: array
                        description: 'The logo of event. <dl> <dt>int `i_height`</dt> <dd>Is returned only if staff has a photo. Image height.</dd> <dt>int `i_width`</dt> <dd>Is returned only if staff has a photo. Image width.</dd> <dt>int `id_gender`</dt> <dd>Is returned only if staff does not have a photo. ID of staff gender. One of {@link \AGenderSid} constants.</dd> <dt>string `url_logo`</dt> <dd>Is returned only if staff has a photo. URL to image.</dd> </dl>'
                      a_class_tab:
                        type: array
                        description: 'The list of keys from class tab.'
                      a_event:
                        type: array
                        description: 'Information for a large number of events. Received only if {@link ElementApi::$s_event} has been specified. In this case, other fields are not populated. Key is the event class key. <i>Primary key in the {@link \RsClassSql} table.</i> <i>Value has the same structure as the return value of {@link ElementApi::_get()}.</i> <dl> <dt>array[] `a_book_available`</dt> <dd> List of sessions available for booking. See {@link \Wl\Event\Book\EventView\ElementApi::$a_book_available}. <dl> <dt>string `dt_date`</dt> <dd>Date/time when the session starts. In UTC.</dd> <dt>string `k_class_period`</dt> <dd>Class session primary keys. <i>Primary keys in table {@link \RsClassPeriodSql}.</i></dd> </dl> </dd> <dt>array `a_class_logo`</dt> <dd> Image of event. See {@link \Wl\Event\Book\EventView\ElementApi::$a_class_logo}. <dl> <dt>int `i_height`</dt> <dd>Is returned only if staff has a photo. Image height.</dd> <dt>int `i_width`</dt> <dd>Is returned only if staff has a photo. Image width.</dd> <dt>int `id_gender`</dt> <dd> Is returned only if staff does not have a photo. ID of staff gender. One of {@link \AGenderSid} constants. </dd> <dt>string `url_logo`</dt> <dd>Is returned only if staff has a photo. URL to image.</dd> </dl> </dd> <dt>string[] `a_class_tab`</dt> <dd>Class tab keys. See {@link \Wl\Event\Book\EventView\ElementApi::$a_class_tab}.</dd> <dt>array[] `a_installment_template`</dt> <dd> List of installment plans. See {@link \Wl\Event\Book\EventView\ElementApi::$a_installment_template}. <dl> <dt>int `i_count`</dt> <dd>The number of payments.</dd> <dt>int `id_duration`</dt> <dd>The duration of a single period. One of the {@link \ADurationSid} constants.</dd> <dt>int `i_period`</dt> <dd>The number of periods specified by `id_period` between individual payments.</dd> <dt>string `k_currency`</dt> <dd>The payment currency Key.</dd> <dt>string `k_pay_installment_template`</dt> <dd> The key of the installment plan template. <i>Primary key in {@link \Thoth\WlPay\Installment\Template\Sql}.</i> </dd> <dt>string `m_amount`</dt> <dd>The amount of the installment plan.</dd> <dt>string `s_duration`</dt> <dd>The title of the installment plan.</dd> </dl> </dd> <dt>array[] `a_schedule`</dt> <dd> Schedule of event sessions. See {@link \Wl\Event\Book\EventView\ElementApi::$a_schedule}. <dl> <dt>true[] `a_day`</dt> <dd> Days of the week when the session occurs. Keys are weekday numbers (1 = Monday, 7 = Sunday), values are always `true`. </dd> <dt>array `a_repeat`</dt> <dd> Repeat periodicity instructions. <dl> <dt>int `i_repeat`</dt> <dd>Count of the periods which specified in `id_repeat`.</dd> <dt>int `id_repeat`</dt> <dd>Measuring unit of `i_repeat` (week, month, year). One of {@link \ADurationSid} constants.</dd> </dl> </dd> <dt>array[] `a_staff`</dt> <dd> A list of staff members who conduct the session. Every element has the following next keys: <dl> <dt>string `k_staff`</dt> <dd>@deprecated Legacy staff key. Returned only for applications from allow-list.</dd> <dt>string `s_name`</dt> <dd>The staff member name.</dd> <dt>string `s_surname`</dt> <dd>The first letter of staff member''s surname.</dd> <dt>string `uid_staff`</dt> <dd>The user key of the staff member. <i>Primary key in {@link \PassportLoginSql} table.</i></dd> </dl> </dd> <dt>string[] `a_virtual_location`</dt> <dd>List of virtual locations. <i>Primary keys in {@link \RsLocationSql} table.</i></dd> <dt>string `dt_end`</dt> <dd>The end date of the session. The local date without time.</dd> <dt>string `dt_start`</dt> <dd>The start date of the session. The local date without time.</dd> <dt>bool `hide_location`</dt> <dd> `true` if the location should be hidden in the event details. Hide if the event is virtual or if the business only has one location. `false` otherwise. </dd> <dt>int `i_capacity`</dt> <dd>The class capacity.</dd> <dt>int `i_duration`</dt> <dd>The duration of the class in seconds.</dd> <dt>bool `is_virtual`</dt> <dd> This will be `true` if the session is not held in person but offered remotely. It will be `false` otherwise. </dd> <dt>string `f_price`</dt> <dd>The price of the session, if it can be purchased separately.</dd> <dt>string `k_class_period`</dt> <dd>The key of the class period.</dd> <dt>string `k_location`</dt> <dd>The key of the location where the session is held.</dd> <dt>string `k_resource_location`</dt> <dd>Structured off-site location data used by the calendar attachment.</dd> <dt>string `s_location`</dt> <dd>The location title.</dd> <dt>string `s_time`</dt> <dd> The time when session occurred. A textual representation of the start and end time of a session. Example: `10:00 am - 11:00 am` </dd> <dt>string `s_timezone`</dt> <dd>The name of the timezone in which the session is held.</dd> <dt>string `text_room`</dt> <dd>The room of the event.</dd> </dl> </dd> <dt>string[] `a_shop_category`</dt> <dd>IDs of online store category. <i>Primary keys in {@link \RsShopCategorySql} table.</i></dd> <dt>array `a_staff_logo`</dt> <dd> Photos of staff. See {@link \Wl\Event\Book\EventView\ElementApi::$a_staff_logo}. <dl> <dt>int `i_height`</dt> <dd>Image height.</dd> <dt>int `i_width`</dt> <dd>Image width.</dd> <dt>string `uid`</dt> <dd>Key of the user. <i>Primary key from {@link \PassportLoginSql} table.</i></dd> <dt>string `url_logo`</dt> <dd>URL to image.</dd> </dl> </dd> <dt>string `dt_book_date`</dt> <dd>Date/time of first event session.</dd> <dt>string `dt_early`</dt> <dd>Early date of event purchase.</dd> <dt>string `dt_end`</dt> <dd>End date of the event instance.</dd> <dt>string `dt_start`</dt> <dd>Date of first event session.</dd> <dt>string `html_end`</dt> <dd>Html End date of the event instance.</dd> <dt>string `html_start`</dt> <dd>Html Date of first event session.</dd> <dt>bool `hide_application`</dt> <dd>Whether event will be hidden in the White Label mobile application.</dd> <dt>string `html_special`</dt> <dd>Special instruction for event.</dd> <dt>int `i_session`</dt> <dd>Session count in event.</dd> <dt>int `i_session_remain`</dt> <dd>Remaining session count in event.</dd> <dt>bool `is_availability_checked`</dt> <dd>Whether event availability was checked.</dd> <dt>bool `is_book`</dt> <dd>Whether event is booked already</dd> <dt>bool `is_full`</dt> <dd>`true` if there are no free spots in the event and booking is available only into wait list.</dd> <dt>bool `is_makeup`</dt> <dd>`true` if the selected session can be a make up session; `false` otherwise.</dd> <dt>bool `is_past`</dt> <dd>`true` if the event session has already started or ended and is not available to book.</dd> <dt>bool `is_policy_custom`</dt> <dd> `true` {@link \Wl\Event\Book\EventView\ElementApi::$a_business_policy} contains the custom policies from the event; `false` otherwise. </dd> <dt>bool `is_virtual`</dt> <dd>`true` if event is virtual; `false` otherwise.</dd> <dt>string `k_book_class_period`</dt> <dd>Key of first event session. <i>Primary key in table {@link \RsClassPeriodSql}.</i></dd> <dt>string `m_price`</dt> <dd>Price of the event session.</dd> <dt>string `m_price_total`</dt> <dd>Price of the full event.</dd> <dt>string `m_price_total_early`</dt> <dd>Price of the full event, should be used as full price while `dt_early` is actual.</dd> <dt>string `s_deny_reason`</dt> <dd>Reason of booking restriction. For example if exception has been thrown.</dd> <dt>string `s_title`</dt> <dd>Event title.</dd> <dt>string `xml_description`</dt> <dd>Description of event. Ready to put into browser.</dd> </dl>'
                      a_installment_template:
                        type: array
                        description: 'A list of installment plans. Each element has the following next keys: <dl> <dt>int `i_count`</dt> <dd>The number of payments.</dd> <dt>int `id_duration`</dt> <dd>The duration of a single period. One of the {@link \ADurationSid} constants.</dd> <dt>int `i_period`</dt> <dd>The number of periods specified by `id_period` between individual payments.</dd> <dt>string `k_currency`</dt> <dd>The payment currency Key.</dd> <dt>string `k_pay_installment_template`</dt> <dd> The key of the installment plan template. <i>Primary key in {@link \Thoth\WlPay\Installment\Template\Sql}.</i> </dd> <dt>string `m_amount`</dt> <dd>The amount of the installment plan.</dd> <dt>string `s_duration`</dt> <dd>The title of the installment plan.</dd> </dl>'
                      a_schedule:
                        type: array
                        description: 'A list of event sessions. Every element has the following next keys: <dl> <dt>true[] `a_day`</dt> <dd> Days of the week when the session occurs. Keys are weekday numbers (1 = Monday, 7 = Sunday), values are always `true`. </dd> <dt>array `a_repeat`</dt> <dd> Repeat periodicity instructions. <dl> <dt>int `i_repeat`</dt> <dd>Count of the periods which specified in `id_repeat`.</dd> <dt>int `id_repeat`</dt> <dd>Measuring unit of `i_repeat` (week, month, year). One of {@link \ADurationSid} constants.</dd> </dl> </dd> <dt>array[] `a_staff`</dt> <dd> A list of staff members who conduct the session. Every element has the following next keys: <dl> <dt>string `k_staff`</dt> <dd>@deprecated Legacy staff key. Returned only for applications from allow-list.</dd> <dt>string `s_name`</dt> <dd>The staff member name.</dd> <dt>string `s_surname`</dt> <dd>The first letter of staff member''s surname.</dd> <dt>string `uid_staff`</dt> <dd>The user key of the staff member. <i>Primary key in {@link \PassportLoginSql} table.</i></dd> </dl> </dd> <dt>string[] `a_virtual_location`</dt> <dd>List of virtual locations. <i>Primary keys in {@link \RsLocationSql} table.</i></dd> <dt>string `dt_end`</dt> <dd>The end date of the session. The local date without time.</dd> <dt>string `dt_start`</dt> <dd>The start date of the session. The local date without time.</dd> <dt>bool `hide_location`</dt> <dd> `true` if the location should be hidden in the event details. Hide if the event is virtual or if the business only has one location. `false` otherwise. </dd> <dt>int `i_capacity`</dt> <dd>The class capacity.</dd> <dt>int `i_duration`</dt> <dd>The duration of the class in seconds.</dd> <dt>bool `is_virtual`</dt> <dd>This will be `true` if the session is not held in person but offered remotely. It will be `false` otherwise.</dd> <dt>string `f_price`</dt> <dd>The price of the session, if it can be purchased separately.</dd> <dt>string `k_class_period`</dt> <dd>The key of the class period.</dd> <dt>string `k_location`</dt> <dd>The key of the location where the session is held.</dd> <dt>string `k_resource_location`</dt> <dd>Structured off-site location data used by the calendar attachment.</dd> <dt>string `s_location`</dt> <dd>The location title.</dd> <dt>string `s_time`</dt> <dd> The time when session occurred. A textual representation of the start and end time of a session. Example: `10:00 am - 11:00 am` </dd> <dt>string `s_timezone`</dt> <dd>The name of the timezone in which the session is held.</dd> <dt>string `text_room`</dt> <dd>The room of the event.</dd> </dl>'
                      a_shop_category:
                        type: array
                        description: 'IDs of online store category.'
                      a_staff_logo:
                        type: array
                        description: 'Photos of staff members. Keys are the keys of staff members. The values are the following: <dl> <dt>int `i_height`</dt> <dd>Image height.</dd> <dt>int `i_width`</dt> <dd>Image width.</dd> <dt>string `uid`</dt> <dd>Key of the user. <i>Primary key from {@link \PassportLoginSql} table.</i></dd> <dt>string `url_logo`</dt> <dd>URL to image.</dd> </dl>'
                      a_timezone_info:
                        type: array
                        description: 'Timezone information for all timezones used in the event schedule. Key is the timezone key. Primary key in the `a_geo_timezone` table. Value contains timezone information from the geo timezone registry: <dl> <dt>int `i_shift`</dt> <dd>UTC offset in hours for this timezone.</dd> <dt>string `s_file`</dt> <dd>Timezone identifier string (e.g. `America/New_York`).</dd> <dt>string|null `text_abbr`</dt> <dd>Timezone abbreviation (e.g. `EST`). `null` if not set.</dd> </dl>'
                      a_visits_required:
                        type: array
                        description: 'A list of classes and events that clients should attend before this one. <dl> <dt>int `i_count`</dt> <dd>The number of visits required.</dd> <dt>int `i_has`</dt> <dd>The number of visits the client has already attended.</dd> <dt>bool `is_event`</dt> <dd>`true` if this is an event, `false` if this is a class.</dd> <dt>string `k_class`</dt> <dd>The key of the class or event.</dd> <dt>string `text_title`</dt> <dd>The name of the class or event.</dd> </dl>'
                      dt_book_date:
                        type: [string, "null"]
                        description: 'That date that should be used to go to the booking wizard.'
                      dt_early:
                        type: [string, "null"]
                        description: 'The early registration date of the event.'
                      dt_end:
                        type: string
                        description: 'The end date of the event.'
                      dt_start:
                        type: string
                        description: 'The start date of the event.'
                      hide_application:
                        type: boolean
                        description: 'Whether event will be hidden in the White Label mobile application. `true` means that event will not be displayed, `false` otherwise.'
                      html_description:
                        type: [string, "null"]
                        description: 'The description of the event.'
                      html_special:
                        type: string
                        description: 'Special instruction for the event.'
                      i_capacity:
                        type: [number, "null"]
                        description: 'Class capacity. `null` if no set.'
                      i_session:
                        type: number
                        format: int32
                        description: 'The session count.'
                      i_session_remain:
                        type: number
                        format: int32
                        description: 'The remaining session count.'
                      id_pay_require:
                        type: number
                        format: int32
                        description: 'The purchase rule ID. One of the {@link RequirePaySid} constants.'
                      id_pay_require_option:
                        type: [number, "null"]
                        description: 'Default required value for {@link RequirePaySid::ADVANCE} payment mode, one of {@link RequirePaySid::ONLINE} or {@link RequirePaySid::VISIT}. `null` means default value not selected.'
                      id_virtual_provider:
                        type: [number, "null"]
                        description: 'The virtual provider ID. One of the {@link VirtualProviderSid} constants. `null` if an in-person event.'
                      is_age_restrict:
                        type: boolean
                        description: 'Whether the event is age restricted. `true` if the event is age restricted, `false` if the event is not.'
                      is_availability_checked:
                        type: boolean
                        description: '`true` if the event availability was checked; `false` if the event has too many sessions, and calculating the availability of each one takes a lot of time.'
                      is_book:
                        type: boolean
                        description: '`true` if the event is already booked; `false` if the event isn''t booked.'
                      is_bookable:
                        type: boolean
                        description: '`true` If the event is bookable; `false` if the event isn''t bookable.'
                      is_full:
                        type: boolean
                        description: '`true` if there are no free spots in the event; booking is available only into the wait list. `false` otherwise.'
                      is_makeup:
                        type: boolean
                        description: '`true` if the selected session can be a make up session. `false` otherwise.'
                      is_past:
                        type: boolean
                        description: '`true` if the selected session has already started and do not available to book. `false` otherwise.'
                      is_policy_custom:
                        type: boolean
                        description: '`true` if the {@link ElementApi::$a_business_policy} contains the custom policies from the event. `false` otherwise.'
                      is_promotion_only:
                        type: boolean
                        description: '`true` if the event can be paid with a Purchase Option only. `false` if full event purchases or single session purchases are permitted.'
                      is_prorate:
                        type: boolean
                        description: '`true` if clients, when they book event, which has been started, can pay only for the sessions in the future. `false` if clients, when they book event, have to pay for the entire event and the number of lefts in the future sessions does not matter.'
                      is_single_session_buy:
                        type: boolean
                        description: 'Determines whether this event allows paying for a single session.'
                      is_virtual:
                        type: boolean
                        description: '`true` if event is virtual; `false` otherwise.'
                      k_book_class_period:
                        type: string
                        description: 'The ID of the session which should be used to go to the booking wizard.'
                      m_price:
                        type: string
                        description: 'The price of a single session of the event.'
                      m_price_total:
                        type: string
                        description: 'The price of the all sessions of the event.'
                      m_price_total_early:
                        type: [string, "null"]
                        description: 'Price of the full event should be used as full price while {@link ElementApi::$dt_early} is actual.'
                      s_deny_reason:
                        type: string
                        description: 'The reason why the event can''t be booked. Empty if {@link ElementApi::$k_book_class_period} isn''t empty.'
                      s_title:
                        type: [string, "null"]
                        description: 'The title of the event.'
                      show_special_instructions:
                        type: boolean
                        description: '`true` if special instructions can be public, `false` if they should be shown only to the clients, who booked the class.'
                      text_end:
                        type: string
                        description: 'End date of the event in user-friendly format.'
                      text_start:
                        type: string
                        description: 'Start date of the event in user-friendly format.'
                      url_book:
                        type: [string, "null"]
                        description: 'Link to the start of the booking wizard to book the closed session from this event or the entire event. Can be `null` if there is no available for booking sessions.'
                      xml_description:
                        type: [string, "null"]
                        description: 'The description of the event.'
      tags:
        - EventView-Element
  '/Wl/Book/Process/Guest/GuestProfile.json':
    get:
      summary: 'Check if user exists. Looks up a guest by email within the specified business and service context. Returns the user key if an existing member is found whose email, birthday (when required), and location eligibility all pass validation.'
      parameters:
        - name: dl_birthday
          in: query
          description: 'Guest''s birthday in MySQL format. Empty if service not restricted by age.'
          schema:
            type: string
        - name: id_service
          in: query
          description: 'Type of the service to book.'
          schema:
            type: number
            format: int32
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: k_id
          in: query
          description: 'Key of service to book. Depending on {@link GuestProfileApi::$id_service} value:, <ul> <li>{@link ServiceSid::CLASSES} - class key. <i>Primary key in {@link \RsClassSql} table.</i></li> <li>{@link ServiceSid::APPOINTMENT} - service key.<i>Primary key in {@link \RsServiceSql} table.</i></li> <li>{@link ServiceSid::BOOKABLE_ASSET} - resource key.<i>Primary key in {@link \RsResourceSql} table.</i></li> </ul>'
          schema:
            type: string
        - name: k_location
          in: query
          description: 'Location key.'
          schema:
            type: string
        - name: text_first_name
          in: query
          description: 'Guest''s first name.'
          schema:
            type: string
        - name: text_last_name
          in: query
          description: 'Guest''s last name.'
          schema:
            type: string
        - name: text_mail
          in: query
          description: 'Guest''s email.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      uid:
                        type: string
                        description: 'UID of found or created user.'
      tags:
        - Guest-GuestProfile
    post:
      summary: 'Creates new user. Creates a new guest profile (or reuses an existing non-member account) for the specified business and service, applying birthday and virtual-account rules, and returns the UID of the created or matched user.'
      parameters:
        - name: dl_birthday
          in: query
          description: 'Guest''s birthday in MySQL format. Empty if service not restricted by age.'
          schema:
            type: string
        - name: id_service
          in: query
          description: 'Type of the service to book.'
          schema:
            type: number
            format: int32
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: k_id
          in: query
          description: 'Key of service to book. Depending on {@link GuestProfileApi::$id_service} value:, <ul> <li>{@link ServiceSid::CLASSES} - class key. <i>Primary key in {@link \RsClassSql} table.</i></li> <li>{@link ServiceSid::APPOINTMENT} - service key.<i>Primary key in {@link \RsServiceSql} table.</i></li> <li>{@link ServiceSid::BOOKABLE_ASSET} - resource key.<i>Primary key in {@link \RsResourceSql} table.</i></li> </ul>'
          schema:
            type: string
        - name: text_first_name
          in: query
          description: 'Guest''s first name.'
          schema:
            type: string
        - name: text_last_name
          in: query
          description: 'Guest''s last name.'
          schema:
            type: string
        - name: text_mail
          in: query
          description: 'Guest''s email.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_mode:
                  type: number
                  format: int32
                  description: 'The mode type used to determine the Lead Source for the created guest. One of the {@link ModeSid} constants. Default is {@link ModeSid::API}.'
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      uid:
                        type: string
                        description: 'UID of found or created user.'
      tags:
        - Guest-GuestProfile
  '/Wl/Login/Promotion/GuestPass/GuestPassList.json':
    get:
      summary: 'Retrieves guest passes for a specific client. Returns all guest passes assigned to the given user, optionally filtered by class and location.'
      parameters:
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: k_class
          in: query
          description: 'Class key to filter guest passes by. `null` if guest passes should not be filtered by class.'
          schema:
            type: [string, "null"]
        - name: k_location
          in: query
          description: 'Location key to filter guest passes by. `null` if guest passes should not be filtered by location.'
          schema:
            type: [string, "null"]
        - name: uid
          in: query
          description: 'User key.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_list:
                        type: array
                        description: 'List of client''s guest passes. <dl> <dt>array `a_image`</dt> <dd> Thumbnail image data for the guest promotion. <dl> <dt>int `i_height`</dt> <dd>Image height.</dd> <dt>int `i_width`</dt> <dd>Image width.</dd> <dt>string `url-thumbnail`</dt> <dd>Thumbnail url.</dd> </dl> </dd> <dt>array|null `a_period_dl`</dt> <dd> Start and end dates of the current reset period. `null` if there is no reset period or the reset date is unavailable. <dl> <dt>string `dl_end`</dt> <dd>Period end date in MySQL date format.</dd> <dt>string `dl_start`</dt> <dd>Period start date in MySQL date format.</dd> </dl> </dd> <dt>array `a_settings`</dt> <dd> Guest pass settings. Empty array when the guest pass has no settings (class-type passes). <dl> <dt>int `i_claim_day`</dt> <dd> Count of days for accept guest invite. If the invitation is not accepted within this time, it will be canceled. </dd> <dt>int `i_limit`</dt> <dd>Times that member can invite the same guest.</dd> <dt>int `i_limit_duration`</dt> <dd> The time during which a member can invite a guest {@link \Wl\Promotion\Guest\Pass\GuestPassSettingsEntity::$i_limit} times. </dd> <dt>int `id_limit_duration`</dt> <dd> Type of the duration of {@link \Wl\Promotion\Guest\Pass\GuestPassSettingsEntity::$i_limit_duration}. One of {@link \ADurationSid} constants. </dd> <dt>bool `is_checkin`</dt> <dd>Whether guests can only enter the gym when the inviting member is checked in.</dd> <dt>bool `is_limit`</dt> <dd>Whether there are limits for a guest promotion.</dd> </dl> </dd> <dt>bool `can_invite`</dt> <dd>`true` if the guest pass is invite-type (the member sends invitations to guests).</dd> <dt>bool `can_send`</dt> <dd>`true` if the member can currently send a guest pass (eligible and within quota).</dd> <dt>string|null `dl_reset`</dt> <dd>Date on which the pass resets or expires, in MySQL date format. `null` if no expiry date is determined.</dd> <dt>bool `has_service`</dt> <dd>`true` if the guest pass is service-type (not invite-type). Inverse of `can_invite`.</dd> <dt>int|null `i_cap_day`</dt> <dd>Maximum guest passes that can be sent per day. `null` if there is no daily cap.</dd> <dt>int|null `i_limit`</dt> <dd>Total number of guest passes initially granted. `null` if the supply is unlimited.</dd> <dt>int|null `i_period`</dt> <dd> Numeric length of the reset period (for example `1` for a one-month period). `null` if the promotion has no reset period. </dd> <dt>int|null `i_remain`</dt> <dd>Number of guest passes remaining in the current period. `null` if the supply is unlimited.</dd> <dt>int|null `i_remain_day`</dt> <dd>Number of guest passes remaining today per the daily cap. `null` if there is no daily cap.</dd> <dt>int `i_use`</dt> <dd>Number of accepted invitations for this guest pass.</dd> <dt>int|null `id_period`</dt> <dd> Unit of the reset period. One of {@link \ADurationSid} constants. `null` if the promotion has no reset period. </dd> <dt>int `id_program_guest`</dt> <dd>Guest pass program ID. One of {@link \RsProgramSid} constants.</dd> <dt>int `id_reset_type_guest`</dt> <dd>Reset type of the host promotion. One of {@link \Wl\Promotion\Guest\Pass\GuestPassResetTypeSid} constants.</dd> <dt>bool `is_expire_note`</dt> <dd>`true` if the pass is close enough to its reset or expiry date that the UI should display a warning.</dd> <dt>bool `is_reset`</dt> <dd>`true` if the remaining count resets on `dl_reset`; `false` if the pass expires on that date.</dd> <dt>string `k_business`</dt> <dd>Business key. <i>Primary key from {@link \RsBusinessSql} table.</i></dd> <dt>string `k_login_promotion`</dt> <dd>Login promotion key of the host membership. <i>Primary key from {@link \RsLoginPromotionSql} table.</i></dd> <dt>string `k_promotion`</dt> <dd>Guest promotion key. <i>Primary key from {@link \RsPromotionSql} table.</i></dd> <dt>string `text_location`</dt> <dd> Comma-separated list of location titles where the promotion is valid. Empty when the promotion is business-wide. </dd> <dt>string `text_owner`</dt> <dd>Full name of the membership owner.</dd> <dt>string `text_period`</dt> <dd>Human-readable reset period label (e.g. "1 month"). Empty when there is no reset period.</dd> <dt>string `text_period_date`</dt> <dd> Human-readable date range of the current period (e.g. "Jan 1 - Jan 31"). Empty when there is no reset period or the reset date is unavailable. </dd> <dt>string `text_promotion_grant`</dt> <dd>Title of the host (granting) promotion.</dd> <dt>string `text_promotion_guest`</dt> <dd>Title of the guest promotion.</dd> <dt>string `uid_owner`</dt> <dd>User key of the membership owner. <i>Primary key from {@link \PassportLoginSql} table.</i></dd> </dl>'
      tags:
        - GuestPass-GuestPassList
