  '/Wl/Member/Progress/Log/Compare/Compare.json':
    get:
      summary: 'Returns list of dates where client logged his progress. Retrieves all distinct dates on which the given user recorded progress entries for the business, excluding the most recent date (since it cannot be compared with itself). Returns an empty array when fewer than two entries exist.'
      parameters:
        - name: k_business
          in: query
          description: 'Key of business to get information for.'
          schema:
            type: string
        - name: uid
          in: query
          description: 'User key to search dates for.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_date:
                        type: array
                        description: 'List of local dates of the progress log.'
      tags:
        - Compare-Compare
  '/Wl/Member/Progress/Field/Edit/Field.json':
    get:
      summary: 'Returns field data. Loads the configuration of the specified progress field for the given business, including its type, measurement unit, visibility settings, and title, and populates the result properties accordingly.'
      parameters:
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: k_field
          in: query
          description: 'Field key.'
          schema:
            type: string
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_measurement:
                        type: array
                        description: 'A list of field measurement. See {@link \Wl\Member\Progress\Field\MeasurementSid}.'
                      a_type:
                        type: array
                        description: 'A list of field type. See {@link \Wl\Member\Progress\Field\TypeSid}.'
                      id_field:
                        type: [number, "null"]
                        description: 'Field ID. One of the {@link ProgressFieldSid} constant.'
                      id_measurement_unit:
                        type: ["null", number]
                        description: 'Field measurement unit ID. One of the {@link \Wl\Member\Progress\Field\MeasurementSid} constants.'
                      id_type:
                        type: number
                        format: int32
                        description: 'Field type ID. One of the {@link \Wl\Member\Progress\Field\TypeSid} constants.'
                      is_active:
                        type: boolean
                        description: 'Whether field is active and should be displayed on page.'
                      is_public:
                        type: boolean
                        description: 'Whether this field is public. If this field is set to <tt>false</tt>, this field is not visible to clients.'
                      is_require:
                        type: boolean
                        description: 'Whether field value is required for clients.'
                      is_require_staff:
                        type: boolean
                        description: 'Whether field value is required for staffs.'
                      text_title:
                        type: [string, "null"]
                        description: 'Field title. Only titles of the custom progress fields can be changed. <tt>null</tt> If default title should be used.'
      tags:
        - Edit-Field
    post:
      summary: 'Saves field data. Updates the configuration of the specified progress field, validating measurement unit, type, and title constraints before persisting the changes. Logs the change when the field data is modified.'
      parameters:
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: k_field
          in: query
          description: 'Field key.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_measurement_unit:
                  type: ["null", number]
                  description: 'Field measurement unit ID. One of the {@link \Wl\Member\Progress\Field\MeasurementSid} constants.'
                id_type:
                  type: number
                  format: int32
                  description: 'Field type ID. One of the {@link \Wl\Member\Progress\Field\TypeSid} constants.'
                is_active:
                  type: boolean
                  description: 'Whether field is active and should be displayed on page.'
                is_public:
                  type: boolean
                  description: 'Whether this field is public. If this field is set to <tt>false</tt>, this field is not visible to clients.'
                is_require:
                  type: boolean
                  description: 'Whether field value is required for clients.'
                is_require_staff:
                  type: boolean
                  description: 'Whether field value is required for staffs.'
                text_title:
                  type: [string, "null"]
                  description: 'Field title. Only titles of the custom progress fields can be changed. <tt>null</tt> If default title should be used.'
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      text_title:
                        type: [string, "null"]
                        description: 'Field title. Only titles of the custom progress fields can be changed. <tt>null</tt> If default title should be used.'
      tags:
        - Edit-Field
  '/Wl/Member/Progress/Goal/Edit/Goal.json':
    get:
      summary: 'Returns progress goal log data. Loads the current goal values for all configured progress fields for the specified user and business, and also returns whether the current viewer is a staff member.'
      parameters:
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: uid
          in: query
          description: 'User key.'
          schema:
            type: ["null", string]
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_field_list:
                        type: array
                        description: 'Field log data. <dl> <dt>int `id_field`</dt> <dd>Field ID. One of the {@link \Wl\Member\Progress\Field\ProgressFieldSid}.</dd> <dt>int `id_measurement_unit`</dt> <dd>Field measurement unit ID. One of the {@link \Wl\Member\Progress\Field\MeasurementSid} constants.</dd> <dt>int `id_type`</dt> <dd>Field type ID. One of the {@link \Wl\Member\Progress\Field\TypeSid} constants.</dd> <dt>string `k_field`</dt> <dd>Field key. <i>Primary key in the {@link \Wl\Member\Progress\Field\Sql} table.</i></dd> <dt>mixed `x_value`</dt> <dd>Progress field log value.</dd> <dt>string `text_name`</dt> <dd>Translated field name.</dd> </dl>'
                      is_staff:
                        type: boolean
                        description: 'How we want to see this page. As a staff or as a user.'
      tags:
        - Edit-Goal
    post:
      summary: 'Saves progress goal fields log. Validates and persists the goal values provided in `$a_field_goal` for the specified user and business, then returns the updated field list in `$a_field_list`.'
      parameters:
        - name: k_business
          in: query
          description: 'Business key.'
          schema:
            type: string
        - name: uid
          in: query
          description: 'User key.'
          schema:
            type: ["null", string]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                a_field_goal:
                  type: array
                  description: 'List of fields. Keys are field IDs ({@link \Wl\Member\Progress\Field\ProgressFieldSid} constants). Values are new field values. Structure of value completely defined by individual fields.'
      responses:
        200:
          description: 'Response always comes with status 200. Inspect the rest of the response body to determine the result.'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'Successful response.'
                    properties:
                      a_field_list:
                        type: array
                        description: 'Field log data. <dl> <dt>int `id_field`</dt> <dd>Field ID. One of the {@link \Wl\Member\Progress\Field\ProgressFieldSid}.</dd> <dt>int `id_measurement_unit`</dt> <dd>Field measurement unit ID. One of the {@link \Wl\Member\Progress\Field\MeasurementSid} constants.</dd> <dt>int `id_type`</dt> <dd>Field type ID. One of the {@link \Wl\Member\Progress\Field\TypeSid} constants.</dd> <dt>string `k_field`</dt> <dd>Field key. <i>Primary key in the {@link \Wl\Member\Progress\Field\Sql} table.</i></dd> <dt>mixed `x_value`</dt> <dd>Progress field log value.</dd> <dt>string `text_name`</dt> <dd>Translated field name.</dd> </dl>'
      tags:
        - Edit-Goal
