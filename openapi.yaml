  '/Wl/Social/Share/SocialShare.json':
    post:
      summary: 'Saves the share post data and returns the secret key for the shared object. Records that the user has shared the specified objects (purchases, bookings, locations, or reviews) to a social network, and returns a secret token that can be appended to the destination URL to deep-link directly to the shared items.'
